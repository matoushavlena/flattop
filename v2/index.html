  ctx.fillStyle = `rgba(4,10,18,${a})`;
  ctx.fillRect(0, 0, W, H);
}

function wrapText(text, maxW, font) {
  ctx.font = font;
  const words = text.split(" ");
  const lines = [];
  let cur = "";
  for (const w of words) {
    const test = cur ? cur + " " + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawOverlays() {
  const t = game.stateT;
  switch (game.state) {
    case "menu": {
      dimScreen(0.55);
      centerText([
        ["FLATTOP", "bold 64px 'Courier New', monospace", "#ffe9a0"],
        ["b r o w s e r   e d i t i o n", "14px 'Courier New', monospace", "#9db8cc"],
      ], 130, 40);
      centerText([
        ["↑ ↓  throttle      ← →  pitch      Z  half-roll      G  gear", "15px 'Courier New', monospace", "#dfe8ef"],
        ["SPACE  machine guns        X or B  drop ordnance", "15px 'Courier New', monospace", "#dfe8ef"],
        ["P pause    M mute", "15px 'Courier New', monospace", "#9db8cc"],
        ["", "10px monospace", "#fff"],
        ["Reverse with a half-loop — the ship rolls herself out on top.", "15px 'Courier New', monospace", "#c8d6e0"],
        ["Land INTO THE WIRES: gear down, slow, level — or bolter and go around.", "15px 'Courier New', monospace", "#c8d6e0"],
      ], 230, 26);
      centerText([[
        `DIFFICULTY   ◀  ${D().label}  ▶`,
        "bold 16px 'Courier New', monospace",
        game.diff === "ace" ? "#e05540" : game.diff === "rookie" ? "#7ee08a" : "#ffe9a0",
      ]], 408, 0);
      if (Math.floor(waveT * 2) % 2 === 0)
        centerText([["PRESS ENTER TO FLY", "bold 22px 'Courier New', monospace", "#ffe94d"]], 448, 0);
      if (best.score)
        centerText([[
          `best: ${best.score} pts — level ${best.level}, rank ${best.rank} (${(DIFFS[best.diff] || D()).label.toLowerCase()})`,
          "12px 'Courier New', monospace", "#9db8cc",
        ]], 482, 0);
      centerText([["a tribute to the golden age of carrier combat", "11px 'Courier New', monospace", "#5f7688"]], 512, 0);
      break;
    }
    case "brief": {
      dimScreen(0.6);
      centerText([[`LEVEL ${game.level + 1}`, "bold 34px 'Courier New', monospace", "#ffe9a0"]], 150, 0);
      const lines = wrapText(LEVELS[game.level].brief, 640, "16px 'Courier New', monospace");
      ctx.textAlign = "center";
      ctx.font = "16px 'Courier New', monospace";
      ctx.fillStyle = "#dfe8ef";
      lines.forEach((l, i) => ctx.fillText(l, W / 2, 210 + i * 26));
      if (Math.floor(waveT * 2) % 2 === 0)
        centerText([["PRESS ENTER TO MAN YOUR AIRCRAFT", "bold 18px 'Courier New', monospace", "#ffe94d"]], 420, 0);
      break;
    }
    case "rearm": {
      const bx = W / 2 - 250, by = 130, bw = 500, bh = 250;
      ctx.fillStyle = "rgba(6,14,24,0.88)";
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = "#3f6a86";
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bw, bh);
      centerText([["REARM & REFUEL", "bold 24px 'Courier New', monospace", "#ffe9a0"]], by + 40, 0);
      centerText([["aircraft repaired — fuel & ammunition full", "13px 'Courier New', monospace", "#9db8cc"]], by + 64, 0);
      const opt = (n, name, sel) => [
        `${sel ? "▶ " : "  "}[${n}] ${name}${sel ? "  ◀" : ""}`,
        sel ? "bold 18px 'Courier New', monospace" : "18px 'Courier New', monospace",
        sel ? "#ffe94d" : "#dfe8ef",
      ];
      centerText([
        opt(1, "8 × 500lb BOMBS", plane.loadout === "bombs"),
        opt(2, "6 × HVAR ROCKETS", plane.loadout === "rockets"),
        opt(3, "TORPEDO + 2 BOMBS", plane.loadout === "torpedo"),
      ], by + 110, 34);
      // deck crew progress
      const frac = 1 - game.rearmT / game.rearmTotal;
      ctx.fillStyle = "#26313d";
      ctx.fillRect(bx + 60, by + 196, bw - 120, 10);
      ctx.fillStyle = frac >= 1 ? "#7ee08a" : "#d9a441";
      ctx.fillRect(bx + 60, by + 196, (bw - 120) * frac, 10);
      if (game.rearmT > 0)
        centerText([["DECK CREW SERVICING…", "13px 'Courier New', monospace", "#d9a441"]], by + 228, 0);
      else if (Math.floor(waveT * 2) % 2 === 0)
        centerText([["ENTER: BACK TO THE FIGHT", "bold 16px 'Courier New', monospace", "#ffe94d"]], by + 228, 0);
      break;
    }
    case "levelclear": {
      dimScreen(0.5);
      centerText([
        [`LEVEL ${game.level + 1} CLEAR`, "bold 40px 'Courier New', monospace", "#7ee08a"],
        [`sector bonus  +${1000 + game.lives * 500}`, "16px 'Courier New', monospace", "#dfe8ef"],
        [`score  ${game.score}`, "16px 'Courier New', monospace", "#dfe8ef"],
      ], 200, 42);
      if (Math.floor(waveT * 2) % 2 === 0)
        centerText([[game.level + 1 >= LEVELS.length ? "PRESS ENTER" : "PRESS ENTER FOR NEXT SORTIE", "bold 20px 'Courier New', monospace", "#ffe94d"]], 400, 0);
      break;
    }
    case "gameover": {
      dimScreen(0.65);
      centerText([
        ["GAME OVER", "bold 48px 'Courier New', monospace", "#e05540"],
        [`final score  ${game.score}   —   rank: ${rankFor(game.score)}`, "18px 'Courier New', monospace", "#dfe8ef"],
        [`reached level ${game.level + 1}`, "15px 'Courier New', monospace", "#9db8cc"],
      ], 200, 46);
      if (game.overReason) {
        const lines = wrapText(game.overReason, 620, "15px 'Courier New', monospace");
        ctx.textAlign = "center";
        ctx.font = "15px 'Courier New', monospace";
        ctx.fillStyle = "#c8d6e0";
        lines.forEach((l, i) => ctx.fillText(l, W / 2, 340 + i * 24));
      }
      if (Math.floor(waveT * 2) % 2 === 0)
        centerText([["PRESS ENTER", "bold 20px 'Courier New', monospace", "#ffe94d"]], 430, 0);
      break;
    }
    case "victory": {
      dimScreen(0.6);
      centerText([
        ["SECTOR SECURED", "bold 44px 'Courier New', monospace", "#7ee08a"],
        ["every island cleared — the fleet sails on", "16px 'Courier New', monospace", "#dfe8ef"],
        [`final score  ${game.score}`, "20px 'Courier New', monospace", "#ffe9a0"],
        [`rank earned: ${rankFor(game.score)}`, "16px 'Courier New', monospace", "#dfe8ef"],
      ], 210, 46);
      if (Math.floor(waveT * 2) % 2 === 0)
        centerText([["PRESS ENTER", "bold 20px 'Courier New', monospace", "#ffe94d"]], 420, 0);
      break;
    }
  }
  if (game.paused && game.state === "fly") {
    dimScreen(0.4);
    centerText([["PAUSED", "bold 36px 'Courier New', monospace", "#dfe8ef"]], H / 2, 0);
  }
  if (muted) {
    ctx.textAlign = "left";
    ctx.font = "11px 'Courier New', monospace";
    ctx.fillStyle = "#9db8cc";
    ctx.fillText("MUTED", 14, H - 34);
  }
}

// ============================================================
//  MAIN LOOP
// ============================================================
let lastT = performance.now();

function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 1 / 30);

  waveT += dt;
  game.msgT = Math.max(0, game.msgT - dt);
  game.shake = Math.max(0, game.shake - dt * 26);
  game.stateT += dt;

  const flying   = (game.state === "fly" && !game.paused);
  const simWorld = flying || game.state === "rearm";   // the war doesn't pause while you rearm
  if (flying) updatePlane(dt);
  if (simWorld) {
    updateCarrier(dt);
    updateRaids(dt);
    updateProjectiles(dt);
    updateEnemies(dt);
  }
  if (game.state === "rearm" && game.rearmT > 0) {
    game.rearmT = Math.max(0, game.rearmT - dt);
    if (game.rearmT === 0) sfx.click();
  }
  updateParticles(dt);
  updateCamera(dt);
  updateEngineSound();

  draw();
  requestAnimationFrame(frame);
}

// debug/test handle (introspection + triggers for automated drivers)
window.__wof = { game, plane, carrier, enemyCount: () => enemies.length, spawnRaidWave };

// boot: build level 1 scenery behind the menu
buildLevel(0);
resetPlaneOnDeck();
cam.x = 0;
cam.y = SEA - H + 100;
requestAnimationFrame(frame);
</script>
